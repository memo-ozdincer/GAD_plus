[project]
name = "gadplus"
version = "0.1.0"
description = "GAD-based transition state search with HIP neural network potential"
requires-python = ">=3.12,<3.13"
dependencies = [
    "hip[cuda121]",
    "transition1x",
    "torch>=2.1",
    "torch-geometric>=2.4",
    "numpy>=1.24,<2",
    "scipy>=1.11",
    "pyarrow>=14.0",
    "ase>=3.22",
    "hydra-core>=1.3",
    "hydra-submitit-launcher>=1.2",
    "mlflow>=2.9",
    "duckdb>=0.9",
    "seaborn>=0.13",
    "geodesic-interpolate @ git+https://github.com/virtualzx-nad/geodesic-interpolate.git@a48c88bfbcabd1e2f883c368f49f2c81a5bc1173",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff"]
analysis = ["matplotlib>=3.7", "plotly>=5.18", "pandas>=2.0"]
sella = ["sella>=2.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gadplus"]

[tool.hatch.metadata]
allow-direct-references = true

[project.scripts]
gadplus = "gadplus.orchestration.run:main"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.uv]
find-links = [
    "https://data.pyg.org/whl/torch-2.5.1+cu121.html",
]

[tool.uv.sources]
hip = { path = "external/hip", editable = true }
transition1x = { path = "external/Transition1x", editable = true }
torch = [
    { index = "pytorch-cu121", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[tool.uv.extra-build-dependencies]
torch-cluster = ["torch", "setuptools", "wheel"]
torch-scatter = ["torch", "setuptools", "wheel"]
torch-sparse = ["torch", "setuptools", "wheel"]
pyg-lib = ["torch", "setuptools", "wheel"]

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true
